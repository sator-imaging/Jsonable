name: Update Embedded Resources

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x.x

    - name: Embed resources
      run: |
        dotnet run --project ./embedded  -f net10.0 -- --force --quiet

    - name: Upload (bot)
      run: |
        # Configure git to use the GitHub Actions bot identity and push any changes
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "[bot] Update embedded resources" || echo "Commit failed or nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
        fi
